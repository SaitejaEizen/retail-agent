[project]
name = "retail-agent"
version = "0.1.0"
description = "Retail Returns Assistant: a small REST service for a developer lab."
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["_bmad", "_bmad-output", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
